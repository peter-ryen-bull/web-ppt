forside:
  title: "Sammenstilt data med en moderne dataplattform"
  lead: "Fra spredt data til kvalitetssikrede analyser"

pains:
  kicker: "UTFORDRINGEN"
  title: "Mye data – for lite innsikt"
  section: "DAGENS SITUASJON"
  items:
    - "Data spredt på flere systemer med begrenset integrasjon"
    - "Samme nøkkeltall beregnes ulikt – ingen felles sannhet"
    - "Kunde-, produkt- og inntektsdata lever i hver sin silo"
    - "Analyser krever manuelle uttrekk og datavask"
    - "Begrenset intern kapasitet til å bygge og forvalte"

konsekvenser:
  kicker: "KONSEKVENSEN"
  title: "Mer tid på dataarbeid enn på analyse"
  section: "DETTE KOSTER"
  items:
    - "Tid brukt på å finne og hente data i stedet for å bruke den"
    - "Lav selvbetjening gir personavhengighet og lang ledetid"
    - "Innsikt er ikke løpende tilgjengelig"
    - "Hver ny problemstilling krever en ny modell og nytt uttrekk"
    - "Datasikkerhet blir ikke ivaretatt, og sensitiv data ligger spredt i ulike systemer"

malbilde:
  kicker: "MÅLBILDE"
  title: "Fra ad-hoc uttrekk til datasett du kan stole på"
  idag_tittel: "I DAG"
  idag:
    - "Manuelle uttrekk og datavask"
    - "Regneark og rapporter som blir utdaterte"
    - "Spredt datagrunnlag – vanskelig å se på tvers"
    - "Lav sporbarhet fra tall til kilde"
    - "Tilgang gis ad hoc, per person"
  malbilde_tittel: "DIT VI SKAL"
  malbilde:
    - "Kvalitetssikrede datasett med navngitt eier"
    - "Felles datagrunnlag med versjonert historikk"
    - "Samme tall i rapporter, API og KI-chat"
    - "Sporbarhet og auditlogger i alle transaksjoner"
    - "Enkelt å bygge nye analyser og finne sammenhenger"
  prinsipper_label: "BÆRENDE PRINSIPPER"
  prinsipper:
    - tittel: "Domeneeierskap"
      tekst: "Domenene eier og forvalter sine egne data"
    - tittel: "Data som produkt"
      tekst: "Kvalitetssikret, dokumentert og gjenbrukbart"
    - tittel: "Selvbetjening"
      tekst: "Plattformen fjerner flaskehalser og muliggjør selvbetjening"
    - tittel: "Innebygd styring"
      tekst: "Sikkerhet, logging og etterlevelse er en del av flyten"

evner:
  kicker: "ARKITEKTUR"
  title: "Fire pillarer i en dataplattform"
  cards:
    - tittel: "Lagring"
      tekst: "Ett felles, styrt datalag. Rådata i bronse, modellert i sølv, dataprodukt i gull."
      gevinst: "Billig historikk, åpne formater, backup og lineage på samme sted."
    - tittel: "Prosessering"
      tekst: "Pipelines som kjører likt hver gang. Modellert i kode, testet før noen ser resultatet."
      gevinst: "Ingen manuelle uttrekk. Avvik stoppes før de når konsumentene."
    - tittel: "Publisering"
      tekst: "Data der folk faktisk jobber: BI, API, apper og chat mot egne data."
      gevinst: "Samme tall uansett kanal. Vi ser hva som brukes – og hva som kan slås av."
    - tittel: "Styring"
      tekst: "Eier, tilgang, klassifisering og sporbarhet. Hvert datasett har en navngitt eier."
      gevinst: "Tillit til tallene, trygg deling og revisjonsklart grunnlag."

ki-chat:
  kicker: "KI I PLATTFORMEN"
  title: "Chat med dataene dine"
  lead: "KI er innebygd i plattformen. Still spørsmål på vanlig språk – rett mot dataene."
  punkter:
    - tittel: "Spør som du snakker"
      tekst: "Svaret kommer som tekst, tall og graf."
    - tittel: "Svar fra styrte data"
      tekst: "Bruker dataproduktene i katalogen. Viser kildene."
    - tittel: "Samme tilganger"
      tekst: "Du ser bare data du har lov til å se."
  bildetekst: "Eksempel: chat i Genie One, Databricks"
  footer: "KI er bare så god som dataene den leser. Dokumenterte dataprodukter med eier gir svar du kan etterprøve."

domener:
  kicker: "ARKITEKTUR"
  title: "Domeneoppdeling og eierskap"
  section: "Domener"
  items:
    - "Hvert domene eier og forvalter sine data"
    - "Domener er ikke flaskehals for hverandre"
    - "Felles infrastruktur, separert data"
    - "Deling skjer som dataprodukter, med kontrakt"
    - "Kostnader fordeles per domene"
  cards:
    - tittel: "Salg og kunde"
      tekst: "CRM, ordre, churn og margin. Eier: kommersiell leder."
    - tittel: "Drift og leveranse"
      tekst: "Fagsystem, kapasitet og kvalitet. Eier: driftsleder."
    - tittel: "Økonomi og HR"
      tekst: "Hovedbok, lønn og bemanning. Eier: CFO."
    - tittel: "Produkt og digitalt"
      tekst: "Bruksdata, apper og integrasjoner. Eier: produktsjef."
  footer: "Domeneoppdeling fjerner flaskehalser. Plattformen er felles – ansvaret er lokalt."

gevinster:
  kicker: "GEVINST"
  title: "Hva får du igjen?"
  cards:
    - nummer: "01"
      tittel: "Data du kan stole på"
      tekst: "Testet, dokumentert og oppdatert. Tallene stemmer overens – uansett hvem som spør."
    - nummer: "02"
      tittel: "Innebygd etterlevelse"
      tekst: "Tilgang, maskering, sletteregler og auditlogger ligger i plattformen. Ikke i et regneark."
    - nummer: "03"
      tittel: "Selvbetjening"
      tekst: "Bestill data selv. Snakk med dem. Bygg rapporter uten å stå i kø hos IT."
    - nummer: "04"
      tittel: "Klar for KI"
      tekst: "Modellene kjører der dataene allerede bor. KI er en akselerator – ikke en snarvei rundt grunnarbeidet."

hvordan:
  kicker: "VEIEN DIT"
  title: "Hvordan begynner man?"
  steps:
    - tittel: "Start med behovet, ikke verktøyet"
      tekst: "Hvilke beslutninger skal bli bedre? Teknologi alene løser ingenting."
    - tittel: "Bygg verdifulle analyser først"
      tekst: "Lever verdi underveis. Infrastruktur kommer etter behov – ikke to år med plattform uten brukere."
    - tittel: "Sett eierskap på data og kvalitetstester tidlig"
      tekst: "Navngitt eier, maskinlesbar avtale, katalog. Da tåler plattformen vekst og inneholder data du kan stole på"
    - tittel: "Skalér og fjern flaskehalser"
      tekst: "Desentraliser der det er trygt. Plattformen skal gjøre teamene raskere, ikke stå i veien."

avslutning:
  title: "Tydelige effekter – når det gjøres riktig"
  items:
    - "Ett felles datagrunnlag i stedet for flere sannheter"
    - "Datasett og analyser med eier, kvalitet og kontrakt"
    - "Arkitektur som skalerer uten å bli en flaskehals"
    - "Gevinst i tillit, etterlevelse, selvbetjening og KI"
  footer: "Vi elsker å løse utfordringer. La oss ta en prat."

aquaplatform-referanse:
  kicker: "KLERI × MILES"
  title: "Referanseprosjekt"
  lead: "AquaPlatform – operasjonsdashbord for havbruk"
  kilder_tittel: "DATAKILDER"
  kilder:
    - navn: "FishTalk"
      tekst: "Fisk, merder, utsett og fôr"
    - navn: "MET / Yr"
      tekst: "Vind- og værprognoser"
    - navn: "Stingray"
      tekst: "Laser og lusetelling med kamera"
    - navn: "MOM-B-rapporter"
      tekst: "Bunnundersøkelser per lokalitet"
    - navn: "Strømmålinger"
      tekst: "Havstrøm ved lokaliteten"
    - navn: "Manuelle lusetellinger"
      tekst: "Tellinger fra merdkant"
  plattform_tittel: "DATAPLATTFORM"
  plattform_tekst: "Samler, kvalitetssikrer og kobler dataene"
  inn: "Data strømmes inn fra kildene"
  bruk_tittel: "BRUK"
  aqua_tekst: "Operasjonsvindu, laserplassering og bunnbelastning per lokalitet"
  powerbi_tekst: "Rapporter og analyser på samme data"
  footer: "Data fra mange kilder samles i én plattform – vasket og kvalitetssikret, så de er til å stole på. Da blir det raskt og enkelt å sette sammen data og dele dem videre."

leveranse:
  kicker: "MOWI: FORESLÅTT FØRSTE LEVERANSE"
  title: "Fiskehelse per fôrresept"
  lead: "Finn sammenhenger mellom fôrresept og dødelighet, vekstfaktor og Superior-kvalitet"
  sporsmal_tittel: "NØKKELSPØRSMÅL"
  sporsmal:
    - "Hvilke fôrresepter henger sammen med lavere dødelighet?"
    - "Hvordan varierer vekstfaktoren mellom fôrreseptene?"
    - "Hvilke fôrresepter gir høyest andel Superior-kvalitet?"
  leveranser_tittel: "UNDERLEVERANSER"
  leveranser:
    - tittel: "Infrastruktur og dataplattform"
      tekst: "Dataplattform på Databricks eller Microsoft Fabric. Grunnmuren for denne og senere analyser."
    - tittel: "Automatisert datainnhenting"
      tekst: "Strukturert og automatisert innhenting av de sentrale datasettene analysen trenger."
    - tittel: "Datakvalitet og datavask"
      tekst: "Datakvalitetstester og datavask som kvalitetssikrer datagrunnlaget."
    - tittel: "1–2 dashbord med drilldown"
      tekst: "Visualiserer resultatene. Fra totalbildet og ned i detaljene."
  footer: "Dashbordene lever videre og oppdateres automatisk når nye data kommer inn."

tidslinje-fem:
  kicker: "TIDSLINJE · 3 MÅNEDER"
  title: "Infrastruktur og første analyse på tre måneder"
  lead: "Involvert med 100–150 % FTE"
  fase_tittel: "FASE"
  maneder:
    - "MÅNED 1"
    - "MÅNED 2"
    - "MÅNED 3"
  faser:
    - varighet: "1 måned"
      tittel: "Infrastruktur og datainnhenting"
      tekst: "Grunnmur og innhenting av dataene analysen trenger."
    - varighet: "1 måned"
      tittel: "Dataanalyse"
      tekst: "Selve analysen, på datagrunnlaget fra måned 1."
    - varighet: "1 måned"
      tittel: "Rapportering og visualisering, produksjonssetting"
      tekst: "I produksjon ved slutten av måned 3."
  footer: "Ved slutten av måned 3 er første analyse i produksjon."

tidslinje-tolv:
  kicker: "TIDSLINJE · 6 MÅNEDER"
  title: "Fra første analyse til to nye på samme plattform"
  lead: "Involvert med 100–150 % FTE"
  faser:
    - periode: "MÅNED 1–3"
      tittel: "Infrastruktur og første analyseprosjekt"
      tekst: "I produksjon ved slutten av måned 3."
    - periode: "MÅNED 4–6"
      tittel: "To nye analyser"
      tekst: "Levert på samme plattform, med nye datakilder og sammenstillinger."
  resultat_tittel: "ETTER 6 MÅNEDER"
  resultat:
    - "Første analyse i produksjon fra slutten av måned 3"
    - "To nye analyser på samme plattform, med nye datakilder og sammenstillinger"

