dataprodukter:
  kicker: "ARKITEKTUR"
  title: "Dataprodukter"
  lead: "Et dataprodukt er et tall eller datasett som er kvalitetssikret, og derfor kan stoles på"
  cards:
    - tittel: "Eier og team"
      tekst: "Navngitt eier i domenet med ansvar for innhold og kvalitet"
    - tittel: "Datakontrakt"
      tekst: "Skjema, frekvens, SLA og klassifisering er avtalt"
    - tittel: "Kvalitet og tester"
      tekst: "Automatiske tester kjøres ved hver oppdatering"
    - tittel: "Dokumentasjon"
      tekst: "Formål, definisjoner, KPI-logikk og lineage i katalogen"
    - tittel: "Tilgang og deling"
      tekst: "Tilgang gis til roller, ikke personer, og logges"
    - tittel: "Livsløp og versjon"
      tekst: "Versjonert historikk, endringsvarsel og utfasing"
  example_label: "Dataprodukt:"
  example:
    - "Ordre- og fakturadata"
    - "Transformering, kvalitetssikring og sammenstilling"
    - "Dataprodukt med eier: «ARR across all value streams»"
    - "Dashboards, rapporter, analyser og KI"

datakontrakter:
  kicker: "ARKITEKTUR"
  title: "Datakontrakter – avtalen mellom produsent og konsument"
  section: "DETTE STÅR I EN DATAKONTRAKT"
  items:
    - "Skjema og datatyper – felter, format, nøkler"
    - "Eier og konsumenter – hvem leverer, hvem bruker"
    - "Frekvens og SLA – når kommer data, hvor ofte"
    - "Kvalitetskrav – terskler for feil og avvik"
    - "Klassifisering – personopplysninger og sensitivitet"
    - "Versjonering – endringsvarsel og bakoverkompatibilitet"
  example_label: "EKSEMPEL"
  example: "produkt:        kunde.kundemaster

    eier:           Kundedomenet

    frekvens:       daglig kl. 06:00

    sla:            99,5 % innen kl. 07:00

    kvalitet:       unik kunde_id, orgnr uten null

    klassifisering: personopplysninger

    versjon:        2.1 – 30 dagers endringsvarsel"
  cards:
    - tittel: "Endringer er versjonert og kvalitetssikret"
      tekst: "Kontrakten testes automatisk ved hver kjøring, og endringer versjoneres"
    - tittel: "Tydelig ansvar"
      tekst: "Eier svarer for kvalitet, konsument for bruk"
    - tittel: "Tydelig tilgangsstyring"
      tekst: "Kontrakten inneholder tilgangsregler"

