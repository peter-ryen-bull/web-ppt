      tekst: "Azure som felles fundament"
    - tittel: "Lakehouse"
      tekst: "Databricks eller Fabric for lagring og compute"
    - tittel: "Orkestrering"
      tekst: "Planlagte og hendelsesdrevne kjøringer"
    - tittel: "Infrastruktur som kode"
      tekst: "Terraform og Bicep"
    - tittel: "CI/CD og miljøer"
      tekst: "Dev, test og prod med automatisk utrulling"
    - tittel: "Overvåking"
      tekst: "Ytelse, feil og kostnad i ett dashboard"
  footer: "Alt som kjører i produksjon er definert som kode. Infrastruktur, pipelines og tilgangsregler versjoneres i Git og rulles ut via CI/CD – det gir reproduserbarhet, revisjonsspor og trygge endringer."

governance:
  kicker: "GOVERNANCE"
  title: "Roller, beslutninger og etterlevelse"
