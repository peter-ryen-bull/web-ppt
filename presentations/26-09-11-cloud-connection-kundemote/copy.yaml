      tekst: "Andel dataprodukter med aktive tester"
    - tittel: "Kjøringer uten avvik"
      tekst: "Målt per uke og per domene"
    - tittel: "Tid til retting"
      tekst: "Fra varsel til publisert korreksjon"

deling:
  kicker: "ARKITEKTUR"
  title: "Deling, tilgang og kostnadsfordeling"
  deling_tittel: "DELING OG TILGANG"
  deling:
    - "Tilgang til roller – ikke til enkeltpersoner"
