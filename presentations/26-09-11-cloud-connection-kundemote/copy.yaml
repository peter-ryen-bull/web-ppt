    - tittel: "Dataeier"
      tekst: "Leder i domenet. Eier innhold, godkjenner tilgang og prioriterer."
    - tittel: "Data steward"
      tekst: "Definisjoner, KPI-logikk, dokumentasjon og datakvalitet."
    - tittel: "Plattformteam"
      tekst: "Infrastruktur, verktøy og selvbetjening. Bygger ikke alt selv."
    - tittel: "Governance-forum"
      tekst: "Policy, prinsipper, prioritering og unntak – møtes månedlig."
  beslutninger_tittel: "BESLUTNINGER OG MØTEPUNKT"
  beslutninger:
    - "Nye dataprodukter godkjennes i governance-forum"
    - "Arkitekturvalg dokumenteres som beslutningsnotat"
    - "Felles backlog prioriteres på verdi og risiko"
    - "Unntak gis tidsbegrenset, aldri permanent"
  etterlevelse_tittel: "ETTERLEVELSE OG PERSONVERN"
  etterlevelse:
    - "Behandlingsgrunnlag og sletteregler ligger i katalogen"
    - "Klassifisering styrer tilgang, maskering og deling"
    - "All bruk logges – audit-spor på tvers av plattformen"
    - "Tilganger gjennomgås periodisk og trekkes automatisk"
  footer: "Governance skal gjøre det enkelt å gjøre riktig – ikke vanskelig å komme i gang."

