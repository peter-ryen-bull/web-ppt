      tekst: "Felter, datatyper og nøkler finnes og er som avtalt"
    - tittel: "Integritetstester"
      tekst: "Unike nøkler, gyldige referanser, ingen tomme verdier"
    - tittel: "Forretningsregler"
      tekst: "Summer stemmer, KPI-er ligger innenfor forventet intervall"
    - tittel: "Ferskhet og volum"
      tekst: "Data kom til rett tid og i forventet mengde"
  feil_label: "NÅR EN TEST FEILER"
