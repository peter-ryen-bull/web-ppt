      tekst: "Felles infrastruktur, katalog og governance – dekkes sentralt"
    - tittel: "Domeneforbruk"
      tekst: "Variabel kostnad følger domenets eget forbruk"
    - tittel: "Initiativ og prosjekt"
      tekst: "Nye dataprodukter belastes initiativet som bestiller"

sikkerhet:
  kicker: "ARKITEKTUR"
  title: "Sikkerhet og infrastruktur"
