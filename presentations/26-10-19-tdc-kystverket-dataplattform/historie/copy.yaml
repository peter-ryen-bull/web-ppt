forside:
  title: "Historien om dataplattformen"
  subtitle: "50 år med samme problem: å gjøre data om til beslutninger"

tidslinje:
  title: "Seks faser – ett problem"

relasjonsmodellen:
  kicker: "1970 · Databasen"
  title: "Codd: skill spørsmålet fra lagringen"

databasen-speil:
  kicker: "1970 · Databasen"
  title: "Hva ble løst – og hva ble det neste problemet?"
  columns:
    - tittel: "Dette ble løst"
      items:
        - "Én felles kilde til data for virksomheten"
        - "Transaksjoner med garantier – driften kunne stole på dataene"
        - "Still spørsmål med SQL uten å styre hvordan dataene hentes"
    - tittel: "Det nye problemet"
      items:
        - "Bygget for drift, ikke analyse – tunge spørringer satte kassa på kne"
        - "Ett system per funksjon: dataene ble spredt på mange databaser igjen"
        - "Ledelsen fikk fortsatt ikke svar på tvers av systemene"

varehuset:
  kicker: "1988 · Datavarehuset"
  title: "Ett felles datavarehus – atskilt fra driften"

varehuset-speil:
  kicker: "1988 · Datavarehuset"
  title: "Hva ble løst – og hva ble det neste problemet?"
  columns:
    - tittel: "Dette ble løst"
      items:
        - "Ett felles datagrunnlag på tvers av systemene"
        - "Historikk: se utviklingen over tid"
        - "Analyser uten å forstyrre driften"
    - tittel: "Det nye problemet"
      items:
        - "Dyrt: spesialisert maskinvare og lange prosjekter"
        - "Tregt å endre: å legge til en ny kilde tok måneder"
        - "Bare strukturerte data: rader og kolonner, ikke logger, tekst og bilder"
  footer: "Og så kom internett – og gjorde alle tre problemene akutte."

regnestykket:
  kicker: "2006 · Stordata"
  title: "Googles svar: la mange maskiner dele arbeidet"

datasjoen:
  kicker: "2010 · Datasjøen"
  title: "Lagre alt – rått"

sjoen-speil:
  kicker: "2006–2010 · Stordata og datasjøen"
  title: "Hva ble løst – og hva ble det neste problemet?"
  columns:
    - tittel: "Dette ble løst"
      items:
        - "Store datamengder kunne lagres og behandles billig"
        - "Alle formater – logger, tekst, bilder, klikkstrømmer"
        - "Maskinlæring fikk rådataene den trengte"
    - tittel: "Det nye problemet"
      items:
        - "Datasumpa: uten oversikt og eierskap var dataene vanskelige å bruke"
        - "Kompleksitet: Hadoop krevde spesialister – SQL-folket sto utenfor"
        - "To parallelle verdener: varehus for BI, sjø for ML – doble kopier, dobbel regning"
  footer: "Uten oversikt er det vanskelig å finne og bruke dataene."

skyen:
  kicker: "2012 · Skyen"
  title: "Skill lagring fra regnekraft"

lakehouse:
  kicker: "2020 · Lakehouse"
  title: "To spor møtes – og blir dataplattformen"

avslutning:
  quote: "«Data is a precious thing and will last longer than the systems themselves»"
  attribution: "— Tim Berners-Lee"
  caption: "Tim Berners-Lee. Oppfinneren av World Wide Web."
