  source: "https://www.kystverket.no/klima-og-barekraft/maru/"

maru-hull:
  title: "Maskinlæring fyller hull i skipsregisteret"
  items:
    - "Skipsregisteret vi trenger for å anslå utslipp er fullt av hull"
    - "Medianverdier dekker det enkleste"
    - "Nevrale nett for servicefart, turtall og slagtype"
    - "70 % mangler drivstofftype. Vi anslår den med LLM. "
  footer: ""

maru-ut:
  title: "Hva kommer ut?"
  subtitle: "Inn i kommunenes klimaregnskap"
  items:
    - |-
      CO₂, metan, NOx, SOx,
      svevestøv
    - "14 skipstyper, 9 størrelser"
    - "Kommune, fylke, havområde"
    - "Innenriks, utenriks, gjennomfart"

kystrisk-tti:
  title: |-
    KystRisk: Hva er risikoen for en ulykke?
    Samme kurs. Hvor lenge til sammenstøt?
  lead: "TTI: tid til sammenstøt. Ett tall per sektor."
  body:
    - "Risiko uttrykkes som et tall fra 0 til 1."
    - |-
      Nær 0 betyr svært lav risiko.
      Basert på kursen du har nå.
    - "Lang tid til sammenstøt gir lav risiko."

kystrisk:
  title: "Maritim risikomodell – KystRisk"
  lead: "De samme seilasene. Et risikotall for hvert tidspunkt."
  items:
    - "Hvert skip får et risikotall ved hvert AIS-punkt"
    - "Så finner vi fjordene der risikoen blir for høy"
    - "Bedre grunnlag for sjøkart og seilingstillatelser."
  footer: "Fortsatt under utvikling."

math-opt:
  title: "Slik gjør vi kartanalysene raskere"
  lead: "Kartanalysene våre bygger ofte på noen grunnspørsmål"
  cards:
    - label: "INNENFOR"
      tittel: "Er dette punktet inni dette området?"
      tekst: "En havn. Et oppdrettsanlegg. En økonomisk sone."
    - label: "NÆR"
      tittel: "Hvilke punkter ligger nær hverandre?"
      tekst: "Nær land. Nær en plattform. Nær et annet skip."
  body:
    - "Milliarder av punkter gir svært mange sammenligninger."
    - "Så vi grupperer punktene i sekskanter. Ubers H3."

h3-hexes:
  title: "Sekskanter inni sekskanter"
  lead: "Ubers H3. Hver sekskant har en unik id."
  footer: "Seksten oppløsninger. Fra enorme sekskanter ned til rundt én meter."

hex-join:
  title: "Koble data sammen med ett tall"
  cards:
    - label: "GEOMETRI"
      tittel: "Punkt i polygon"
      items:
        - "Matematikk på hver rad"
        - "Skalerer ikke til millarder av rader"
    - label: "H3"
      tittel: "En celle-ID som er lagret i tabellen"
      items:
        - "Koble på ID. Hopp over irrelevante data"
        - "Greit for millarder av rader"
  caption: "KystRisk."
  bunn: "Vi filtrerer med H3, størrelse 8. Det fjerner >99 %. Så ST-funksjoner for nøyaktig avstand."

