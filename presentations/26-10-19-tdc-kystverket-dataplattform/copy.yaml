    - label: "NÆR"
      tittel: "Hvilke punkter ligger nær hverandre?"
      tekst: "Nær land. Nær en plattform. Nær vårt skip."
  body:
    - "Milliarder av punkter gir svært mange sammenligninger."
    - "Så vi grupperer punktene i sekskanter. Ubers H3."

