  title: "Maskinlæring fyller hull i skipsregisteret"
  items:
    - "Skipsregisteret vi trenger for å anslå utslipp er fullt av hull"
    - "Medianverdier dekker det enkleste"
    - "Nevrale nett for servicefart, turtall og slagtype"
    - "70 % mangler drivstofftype. Vi anslår den."
  footer: "Modellen er åpen. github.com/Kystverket/maru"

maru-ut:
