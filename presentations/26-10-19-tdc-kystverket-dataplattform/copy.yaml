maru-hvorfor:
  title: "Hvordan ble det gjort før?"
  items:
    - "Før: beregninger basert på drivstoff solgt i Norge"
    - "Skip fyller drivstoff i utlandet og seiler her. Salgstallene gir ikke hele bildet."
    - "MarU bruker data om hvor skipene faktisk seiler."

maru:
  title: "Maritim utslippsmodell – MarU"
  lead: "Her møter volumet metoden"
  items:
