    - tittel: "Vi vet hva slags skip det er"
      tekst: "Registeret. Type, størrelse, hvordan det er bygd for å seile."
    - tittel: "Så anslår vi drivstofforbruket"
      tekst: "Ved denne farten. Dobler du farten, åttedobler du effektbehovet."
